# Frontend HOT-RELOAD dev override — EXPLICIT opt-in (NOT auto-merged).
# Runs the frontend as a Vite dev server with the host source bind-mounted,
# for fast local iteration. This is a DEV convenience only — it is NOT the
# deployable artifact.
#
# Production / deployable (the default): Vite rolls up to static JS, nginx
# serves it, no node_modules in the runtime image:
#   docker compose up -d                         # uses docker-compose.yml
#
# Hot-reload dev server (opt-in, this file):
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d frontend
#
# Both run on their own host port:
#   production (nginx static, base file): http://localhost:8084
#   hot-reload dev server (this file):    http://localhost:8085
#
# The retirement planner is now a first-class feature of the app itself
# (route /retirement), so there is no separate dev service for it.
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: ./Dockerfile.dev
      args:
        NPM_TOKEN: ${NPM_TOKEN}
    # Vite dev server (HMR) instead of the nginx static build.
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173"]
    environment:
      # Proxy /api calls to the backend-proxy service inside the compose network.
      VITE_PROXY_TARGET: http://backend-proxy:80
    # Publish on 8085 (dev) to avoid colliding with the base 8084->80 binding,
    # which Compose would otherwise merge into a double host-port bind.
    ports:
      - "8085:5173"
    volumes:
      # Mount source for hot-reload; keep container-built node_modules.
      - ./frontend:/code
      - /code/node_modules
    networks:
      - management
    depends_on:
      - backend-proxy
