# network
networks:
  data:
  management:


# storage
volumes:
  stock-data:
  redis-data:

x-django-base: &django-base
  build:
    context: ./backend
    dockerfile: ./Dockerfile
  image: backend_stock
  volumes:
    - ./backend:/code
    - type: bind
      source: ./backend/static
      target: /code/static
  env_file:
    - .env

# computes
services:
  backend-proxy:
    image: nginx
    ports:
      - "8083:80"
    volumes:
      - ./backend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
    command: [nginx-debug, '-g', 'daemon off;']
    networks:
      - management

  db:
    image: mysql:9.7.0
    restart: always
    ports:
      - "3306:3306"
    volumes:
      - stock-data:/var/lib/mysql # persisted volume
      # - ./backend/mysql.cnf:/etc/mysql/conf.d/feng.cnf
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_HOST: ${MYSQL_ROOT_HOST}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    networks:
      - data

  web:
    <<: *django-base

    command: bash -c "python /code/manage.py migrate --noinput && python /code/manage.py createsuperuser --noinput || true && python /code/manage.py runserver 0.0.0.0:8001"
    # command:
    #   "gunicorn -w 1 -t 300 -b 0.0.0.0:8001 --log-level=info fin.wsgi"
    networks:
      - data
      - management
    depends_on:
      - db

  celery:
    <<: *django-base
    image: backend_stock
    command: celery -A fin.celery worker -Q summary,stock,statement,price,news -l INFO
    networks:
      - data
    depends_on:
      - db
      - redis
      - web

  redis:
    image: redis
    volumes:
      - redis-data:/data
    networks:
      - data

  frontend:
    image: frontend_stock
    build:
      context: ./frontend
      dockerfile: ./Dockerfile
      args:
        NPM_TOKEN: ${NPM_TOKEN}
        VITE_API_URL: /api/v1
    volumes:
      - ./frontend:/code
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8084:80"
    command: [nginx-debug, '-g', 'daemon off;']
    networks:
      - management
